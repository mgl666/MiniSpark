[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minispark"
version = "0.1.0"
description = "一个基于 Python 的轻量化个人 AI Agent 框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MiniSpark" }]
keywords = ["ai", "agent", "llm", "assistant", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "certifi>=2024.2.2",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "apscheduler>=3.10",
    "mcp>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
web = [
    "ddgs>=6.0",
]

[project.scripts]
minispark = "minispark.cli:app"

[project.urls]
Documentation = "https://github.com/MiniSpark/docs"

[tool.hatch.build.targets.wheel]
packages = ["minispark"]
exclude = ["minispark/memory/*.db*"]

[tool.hatch.build.targets.sdist]
include = ["minispark", "tests", "README.md"]
exclude = ["minispark/memory/*.db*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"